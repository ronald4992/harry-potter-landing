  <ellipse cx="50" cy="42" rx="2.5" ry="3" fill="#4a3018"/>
  <!-- Sparkle in eyes -->
  <circle cx="39" cy="41" r="0.9" fill="#ffffff"/>
  <circle cx="51" cy="41" r="0.9" fill="#ffffff"/>
  <!-- Smile -->
  <path d="M40 50 Q44 54 48 50" stroke="#b36952" stroke-width="1.8" fill="none" stroke-linecap="round"/>
  <!-- Scarf / Gryffindor Collar -->
