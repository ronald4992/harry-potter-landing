      <stop offset="0%" stop-color="#740001"/>
      <stop offset="100%" stop-color="#2a0000"/>
    </linearGradient>
    <linearGradient id="hermione-hair" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#8a532e"/>
      <stop offset="100%" stop-color="#542e14"/>
    </linearGradient>
  </defs>
  <rect width="88" height="88" rx="44" fill="url(#hermione-bg)"/>
  <!-- Hair back -->
  <ellipse cx="44" cy="46" rx="28" ry="30" fill="url(#hermione-hair)"/>
  <!-- Face -->
  <ellipse cx="44" cy="44" rx="17" ry="20" fill="#fddcb8"/>
